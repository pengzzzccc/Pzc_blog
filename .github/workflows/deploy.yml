name: deploy

on:
  push:
    branches: [main] # 每次合并 PR 或直接推送到 main 分支时自动触发更新
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sync-steam 调用时传入新提交；否则会检出调用方触发时的旧提交
          ref: ${{ inputs.ref || github.sha }}

      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: 同步最新 Steam 游戏库（若已配置 STEAM_API_KEY）
        if: env.STEAM_API_KEY != ''
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ vars.STEAM_ID || '76561199160274340' }}
        run: node scripts/sync-steam.mjs

      - name: 类型与内容检查
        run: pnpm check

      - name: 构建静态站点
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
        run: pnpm build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
