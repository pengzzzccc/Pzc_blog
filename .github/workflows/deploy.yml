name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的提交 SHA（留空为当前分支最新提交；可用于回滚）
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # sync-steam 调用时传入新提交；否则会检出调用方触发时的旧提交
          ref: ${{ inputs.ref || github.sha }}

      - id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pzc-blog" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}
            PUBLIC_UMAMI_SRC=${{ vars.PUBLIC_UMAMI_SRC }}
            PUBLIC_UMAMI_WEBSITE_ID=${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # 服务器准备好后，在仓库 Variables 中设置 DEPLOY_ENABLED=true 才会部署
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pzc-blog' }}
      SHA: ${{ needs.build.outputs.sha }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: 配置 SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 同步 compose 文件并更新镜像
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml "$remote:$DEPLOY_PATH/docker-compose.yml"
          ssh -i ~/.ssh/deploy_key "$remote" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          touch .env
          for kv in "SITE_IMAGE=$IMAGE" "IMAGE_TAG=$SHA"; do
            key="\${kv%%=*}"
            if grep -q "^\$key=" .env; then sed -i "s|^\$key=.*|\$kv|" .env; else echo "\$kv" >> .env; fi
          done
          docker compose pull site
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF

      - name: 健康检查
        if: vars.PUBLIC_SITE_URL != ''
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "${{ vars.PUBLIC_SITE_URL }}"
