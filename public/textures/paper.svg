<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- 纸张纹理：大块斑驳 + 横向纤维 + 细颗粒，灰度噪点以低透明度叠在底色上 -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0125" numOctaves="3" seed="7" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <filter id="fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025 0.5" numOctaves="2" seed="3" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="480" height="480" filter="url(#mottle)" opacity="0.12" />
  <rect width="480" height="480" filter="url(#fiber)" opacity="0.06" />
  <rect width="480" height="480" filter="url(#grain)" opacity="0.16" />
</svg>
